name: Portfolio build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  repository_dispatch:
    types: [resume_changed]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Install Chromium for contact browser checks
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify contact form with test adapters
        run: npm run test:contact:e2e

  build:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps --only-shell chromium

      - name: Build site from vault content and generate resume PDF
        env:
          RESUME_CONTENT_TOKEN: ${{ secrets.RESUME_CONTENT_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_TURNSTILE_SITE_KEY || '' }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
        run: |
          if [[ -z "$RESUME_CONTENT_TOKEN" ]]; then
            echo "RESUME_CONTENT_TOKEN is required for trusted builds." >&2
            exit 1
          fi
          npm run build

      - name: Verify resume PDF
        run: test -s dist/resume/Zeus-Zaragoza-Resume.pdf

      - name: Validate Cloudflare Worker and static assets
        run: npx wrangler deploy --dry-run

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error

      - name: Deploy validated site to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are required for main deployments." >&2
            exit 1
          fi
          npx wrangler deploy
